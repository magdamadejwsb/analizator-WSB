name: Publikacja nowej wersji

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    
jobs:
    release:
        runs-on: ubuntu-24.04
        
        steps:
            -
                name: Pobieranie kodu
                uses: actions/checkout@v4
            -
                name: Instalacja Pythona
                uses: actions/setup-python@v5
                with:
                    python-version: "3.12" 
            - 
                name: Instalacja zależności
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements.txt  
            -
                name: Uruchamianie testow
                run: python -m pytest -v
            - 
                name: Sprawdzanie zgodności wersji
                run: |
                    python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Niezgodny numer wersji'"
            -
                name: Budowanie pakietu
                run: python -m build
                
            - 
                name: Publikacja GitHub Release
                uses: softprops/actions-gh-release@v2
                with:
                    files: dist/*.whl
                    fail_on_unmatched_files: true
                    generate_release_notes: true
